rules:
  - id: hardcoded-password
    category: general
    title: Hard-coded password
    severity: HIGH
    keywords:
      - password
    # Lines with a '#' before "password" (commented-out code) are ignored.
    regex: '(?im)^[^#\n]*(password)\s*=\s*"(?P<secret>[^"]{8,})"'
    secret-group-name: secret