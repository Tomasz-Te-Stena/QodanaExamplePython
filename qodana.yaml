####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: jetbrains/qodana-python-community:2026.1
bootstrap: |
  pip install -r requirements.txt
profile:
  base:
    name: qodana.recommended
  inspections:
    - inspection: HardcodedPasswords
      enabled: true
hardcodedPasswords:
  reportDefaultSuspiciousVariableNames: true
